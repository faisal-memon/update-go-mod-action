name: Update Go Version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update go.mod
        id: update
        uses: ./

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Update Go version to ${{ steps.update.outputs.latest-version }}
          title: Update Go version to ${{ steps.update.outputs.latest-version }}
          body: |
            Updates this action's go.mod Go version to the latest stable release.
          branch: chore/update-go-${{ steps.update.outputs.latest-version }}
